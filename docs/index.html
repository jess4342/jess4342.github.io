<style>@property --hx{syntax:'<percentage>';inherits:true;initial-value:50%}@property --hy{syntax:'<percentage>';inherits:true;initial-value:40%}@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}@keyframes zoomPulse{0%{transform:scale(.97);opacity:.6}60%{transform:scale(1.008)}100%{transform:scale(1);opacity:1}}.zoomPulse{animation:zoomPulse .5s cubic-bezier(.2,.8,.2,1)}body{margin:0;background:var(--bg);color:var(--ink);cursor:url('./assets/cursor-pixel.png') 4 2,auto}a,button{cursor:url('./assets/cursor-pixel.png') 4 2,auto}a{color:var(--link)}a:hover{color:var(--link-hover)}</style>

<body>
<div id="root"></div>
<script type="text/babel" src="site.jsx"></script>
<script type="text/babel">
const {NavBar}=window.Jess4342CybersecurityPortfolioDesignSystem_6543ae;
function scrollToId(id){
const el=document.getElementById(id);
if(!el)return;
const y=el.getBoundingClientRect().top+window.scrollY-64;
window.scrollTo({top:Math.max(0,y),behavior:'smooth'});
el.classList.remove('zoomPulse');
setTimeout(()=>el.classList.add('zoomPulse'),350);
}
function App(){
const [active,setActive]=React.useState('Home');
const ids=['home','about','blog','timeline','contact'];
React.useEffect(()=>{
const onScroll=()=>{
let current='Home';
for(const id of ids){
const el=document.getElementById(id);
if(el && el.getBoundingClientRect().top<=140){current=id.charAt(0).toUpperCase()+id.slice(1);}
}
setActive(current);
};
window.addEventListener('scroll',onScroll,{passive:true});
return ()=>window.removeEventListener('scroll',onScroll);
},[]);
return(<React.Fragment>
<NavBar name="jess4342" items={['Home','About','Blog','Timeline','Contact']} active={active} onNavigate={sec=>scrollToId(sec.toLowerCase())} />
<div id="home"><Home onNavigate={sec=>scrollToId(sec.toLowerCase())}/></div>
<div id="about"><About/></div>
<div id="blog"><Blog/></div>
<div id="timeline"><Timeline/></div>
<div id="contact"><Contact/></div>
<footer style={{borderTop:'var(--border-w-thick) solid var(--ink)',padding:'28px 32px',display:'flex',justifyContent:'space-between',alignItems:'center',fontFamily:'var(--font-pixel)',fontSize:11,letterSpacing:'var(--ls-pixel)',color:'var(--text-faint)',textTransform:'uppercase'}}>
<span>© 2026 jess4342 — All rights reserved</span>
<span>DESIGNED &amp; BUILT BY JESS CHEN</span>
</footer>
</React.Fragment>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
